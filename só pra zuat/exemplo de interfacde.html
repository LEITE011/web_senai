<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaborTech - Portal de Receitas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>SaborTech</h1>
        <nav>
            <ul>
                <li><a href="#receitas">Receitas</a></li>
                <li><a href="#ingredientes">Ingredientes</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="receitas">
            <h2>Listagem de Receitas</h2>
            <button onclick="location.href='cadastro-receita.html'">Adicionar Nova Receita</button>
            <div class="card-list">
                <!-- Cards de receitas aqui -->
            </div>
        </section>

        <section id="ingredientes">
            <h2>Listagem de Ingredientes</h2>
            <button onclick="location.href='cadastro-ingrediente.html'">Adicionar Novo Ingrediente</button>
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Quantidade</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Linhas da tabela de ingredientes aqui -->
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 SaborTech. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
